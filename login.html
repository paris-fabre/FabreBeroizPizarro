<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo-contenedor">
            <a href="./index.html">
                <img class="logo" src="./img/logo.png" alt="CareSkin">
            </a>
        </div>
        <nav class="horizontal">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li class="item-login"><a href="./login.html">Login</a></li>
                <li class="item-registro"><a href="./register.html">Registro</a></li>
                <li class="item-saludo"></li>
                <li class="item-logout"></li>
            </ul>
           </nav>
            <form action="./search-results.html" method="get" class="buscador-form">
                <input type="text" name="search" placeholder="Buscar..." class="buscador-input">
                <button type="submit" class="buscador-boton">Buscar</button>
                <p class="buscador-error"></p>
            </form>
    </header>
    <div class="layout">
       <nav class="vertical">
            <ul id="lista-categorias"></ul>
        </nav>
    <div class="login">
        <form action="./index.html" method="get">
            <h2>Iniciar Sesión</h2>
            <label for="email">Email:</label>
            <input type="email" name="mail" id="email">
            <p class="error" id="error-email"></p>

            <label for="password">Contraseña:</label>
            <input type="password" name="pass" id="password">
            <p class="error" id="error-password"></p>

            <button type="submit">Ingresar</button>
            <a href="./register.html">No tengo cuenta</a>
        </form>
    </div>
    </div>
    <footer>
        <ul>
            <li>Isabel Beroiz</li>
            <li>Josefina Pizarro</li>
            <li>Paris Fabre</li>
        </ul>
    </footer>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
